<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkHub: Назар</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="card">
        <button id="themeBtn">Змінити тему</button>

        <img class="avatar" src="avatar.jpg" alt="Мій аватар">

        <h2 class="name">Назар</h2>
        <p class="status">Початківець у програмуванні</p>

        <div class="links">
            <a href="https://www.instagram.com/" class="btn" target="_blank">Instagram</a>
            <a href="https://www.tiktok.com/" class="btn" target="_blank">TikTok</a>
            <a href="https://github.com/" class="btn" target="_blank">GitHub</a>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
